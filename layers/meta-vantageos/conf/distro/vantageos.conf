DISTRO = "vantageos"
DISTROOVERRIDES = "vantageos"
DISTRO_VERSION = "kici-kici"
SDK_VERSION = "${DISTRO_VERSION}"
# TCLIBC = "musl"

USER_CLASSES = ""
PACKAGE_CLASSES = "package_ipk"
INHERIT_DISTRO = "devshell sstate license remove-libtool create-spdx buildstats"
INHERIT += "${PACKAGE_CLASSES} ${USER_CLASSES} ${INHERIT_DISTRO}"

INIT_MANAGER = "systemd"

LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

DISTRO_FEATURES_DEFAULT = "debuginfod ext2 ipv4 ipv6 usbhost wifi xattr nfs pci vfat seccomp security"
GTK2DISTROFEATURES = ""
GTK3DISTROFEATURES = ""

# crates.io rejects BitBake's default wget User-Agent with HTTP 403
# (see https://crates.io/data-access). Send a descriptive UA so
# crate:// SRC_URI fetches (e.g. suricata's Rust deps) succeed for
# every builder of this distro, not just local machines.
FETCHCMD_wget = "/usr/bin/env wget -U 'vantageos-build/1.0' --tries=2 --timeout=100"

