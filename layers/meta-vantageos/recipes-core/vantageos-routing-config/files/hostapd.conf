# wlan1 = Alfa AWUS036AX (rtw89_8852bu_git), pinned by 10-alfa-wlan.link.
interface=wlan1
driver=nl80211
ssid=VantageOS-Setup
hw_mode=a
channel=36
country_code=PL
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
ieee80211d=1
ieee80211h=1

# WPA2-PSK required: dynamic VLAN assignment below is keyed per-PSK, not per-SSID.
# Both AKMs advertised: plain WPA-PSK as a compatibility fallback for clients
# whose Wi-Fi stack doesn't support PSK-SHA256 (seen: PC associates fails with
# a generic "can't join this network" error while SHA256-capable phones join
# fine) -- WPA-PSK-SHA256 kept for the clients that do support it.
wpa=2
wpa_key_mgmt=WPA-PSK WPA-PSK-SHA256
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# PMF optional, not required: this single BSS carries Trusted/Guest traffic
# too (see note below on why there's no separate Guest BSS), and forcing
# Required here would lock out any station that can't do 802.11w.
ieee80211w=1

# Dynamic VLAN: every station must resolve to a vlanid via wpa_psk_file
# (wildcard entry -> quarantine VLAN 5). File managed/tested manually on-target.
dynamic_vlan=2
vlan_bridge=br-vlan
wpa_psk_file=/etc/hostapd/wpa_psk

# NOTE: no second bss= block for a dedicated Guest SSID (PDF SS3.1 model).
# Confirmed via `iw phy` on this exact radio (phy2/wlan1): interface
# combination caps AP-role interfaces at 1 concurrent, so a second
# always-broadcast AP interface cannot start alongside this one on the
# same card. Guest access should instead be a second wpa_psk_file entry
# with its own dedicated PSK -> vlanid=20, riding the same SSID (still no
# captive portal, still password-only per PDF SS5.3, just not a separate
# broadcast network).
