# wlan1 = Alfa AWUS036AX (rtw89_8852bu_git), pinned by 10-alfa-wlan.link.
interface=wlan1
driver=nl80211

# Control socket for hostapd_cli. Required for security-hub's ConnectedStations
# (hostapd_cli all_sta) -- without this, hostapd_cli fails with
# "wpa_ctrl_open: No such file or directory" (confirmed on-device). Path matches
# system.paths.hostapd_control in vantageos-security-hub's config.yaml. Group
# grants the non-root securityhub service user access without needing root.
ctrl_interface=/var/run/hostapd
ctrl_interface_group=securityhub
ssid=VantageOS
hw_mode=g
channel=6
country_code=PL
ieee80211n=1
wmm_enabled=1
ieee80211d=1

# WPA2-PSK required: dynamic VLAN assignment below is keyed per-PSK, not per-SSID.
# Both AKMs advertised: plain WPA-PSK as a compatibility fallback for clients
# whose Wi-Fi stack doesn't support PSK-SHA256 (seen: PC associates fails with
# a generic "can't join this network" error while SHA256-capable phones join
# fine) -- WPA-PSK-SHA256 kept for the clients that do support it.
wpa=2
wpa_key_mgmt=WPA-PSK WPA-PSK-SHA256
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# PMF optional, not required: this single BSS carries Trusted/Guest traffic
# too (see note below on why there's no separate Guest BSS), and forcing
# Required here would lock out any station that can't do 802.11w.
ieee80211w=1

# Dynamic VLAN: every station must resolve to a vlanid via wpa_psk_file
# (wildcard entry -> quarantine VLAN 5). File managed/tested manually on-target.
# Path matches system.paths.hostapd_psk_file in security-hub's config.production.yaml
# (moved off /etc/hostapd/wpa_psk -- security-hub-api owns /var/lib/securityhub outright
# via StateDirectory=, so it no longer needs another package's directory chgrp'd for it).
dynamic_vlan=2
vlan_bridge=br-vlan
wpa_psk_file=/var/lib/securityhub/rendered/wpa-psk

# Per-station AP_VLAN interface instead of one shared interface per VLAN group.
# Without this, two stations resolved to the same VLAN (e.g. two IoT devices)
# share a single wlan1.<VID> netdev; mac80211 relays unicast frames between
# them directly at the 802.11 layer, so the traffic never reaches the bridge
# device -- invisible to bridge-nf-call-iptables, nftables, and therefore
# Suricata's NFQUEUE, regardless of any ruleset (confirmed on-device 2026-08-15
# via a temporary nft log rule: zero hits during an active, responsive nmap
# scan between two same-VLAN stations). With this on, each station gets its
# own AP_VLAN interface added to the same per-VLAN bridge, so inter-station
# traffic has to cross the bridge like any other L2 hop -- forcing it through
# the same nftables/Suricata path that already inspects everything else.
# UNVERIFIED at time of writing: hostapd's own doc says this "implies...
# ebtables filtering of inter-STA traffic" -- not yet confirmed whether that
# permits inter-station traffic onto the bridge (what this is for) or isolates
# it by default the way ap_isolate does. If the latter, Trusted (VID 10,
# ClientIsolation=false) may regress on local device-to-device traffic it
# currently relies on. Validate live before trusting this in production.
per_sta_vif=1

# NOTE: no second bss= block for a dedicated Guest SSID on this radio.
# Confirmed via `iw phy` on this exact radio (phy2/wlan1): interface
# combination caps AP-role interfaces at 1 concurrent, so a second
# always-broadcast AP interface cannot start alongside this one on the
# same card. Guest instead runs as its own SSID on the other physical
# radio (wlan0, onboard) -- see hostapd-guest.conf -- so vlanid=20 is
# intentionally absent from wpa_psk below; nothing on this radio maps to it.
