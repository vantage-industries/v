bind-dynamic
local-service
no-resolv
server=1.1.1.1
server=8.8.8.8
no-hosts
domain-needed
bogus-priv
cache-size=0
address=/vantageos.local/192.168.5.1

# DHCP reservations rendered by security-hub-api (system.paths.dnsmasq_reservations in
# config.production.yaml). Read at startup only -- the reconciler SIGHUPs dnsmasq after
# every rewrite (internal/system/linux/dhcp_write.go) to pick up changes without a restart.
dhcp-hostsfile=/var/lib/securityhub/rendered/reservations

# --- VLAN 5: Quarantine / onboarding (192.168.5.0/24) ---
interface=br-vlan5
listen-address=192.168.5.1
dhcp-range=set:vlan5,192.168.5.10,192.168.5.99,255.255.255.0,12h
dhcp-option=tag:vlan5,3,192.168.5.1
dhcp-option=tag:vlan5,6,192.168.5.1

# --- VLAN 10: Trusted / baza domowa (192.168.10.0/24) ---
interface=br-vlan10
listen-address=192.168.10.1
dhcp-range=set:vlan10,192.168.10.10,192.168.10.99,255.255.255.0,12h
dhcp-option=tag:vlan10,3,192.168.10.1
dhcp-option=tag:vlan10,6,192.168.10.1

# --- VLAN 20: Guest (192.168.20.0/24) ---
# Routed off wlan0 directly, not a bridge -- brcmfmac (onboard radio)
# rejects bridge enslavement, see 26-wlan0.network.
interface=wlan0
listen-address=192.168.20.1
dhcp-range=set:vlan20,192.168.20.10,192.168.20.99,255.255.255.0,12h
dhcp-option=tag:vlan20,3,192.168.20.1
dhcp-option=tag:vlan20,6,192.168.20.1

# --- VLAN 30: Cloud Native (Xiaomi, TV) (192.168.30.0/24) ---
interface=br-vlan30
listen-address=192.168.30.1
dhcp-range=set:vlan30,192.168.30.10,192.168.30.99,255.255.255.0,12h
dhcp-option=tag:vlan30,3,192.168.30.1
dhcp-option=tag:vlan30,6,192.168.30.1

# --- VLAN 40: Kamery / CAM (192.168.40.0/24) ---
interface=br-vlan40
listen-address=192.168.40.1
dhcp-range=set:vlan40,192.168.40.10,192.168.40.99,255.255.255.0,12h
dhcp-option=tag:vlan40,3,192.168.40.1
dhcp-option=tag:vlan40,6,192.168.40.1

# --- VLAN 50: IoT offline / hybryda (192.168.50.0/24) ---
interface=br-vlan50
listen-address=192.168.50.1
dhcp-range=set:vlan50,192.168.50.10,192.168.50.99,255.255.255.0,12h
dhcp-option=tag:vlan50,3,192.168.50.1
dhcp-option=tag:vlan50,6,192.168.50.1

# --- VLAN 60: Services (HA, NVR) (192.168.60.0/24) ---
interface=br-vlan60
listen-address=192.168.60.1
dhcp-range=set:vlan60,192.168.60.10,192.168.60.99,255.255.255.0,12h
dhcp-option=tag:vlan60,3,192.168.60.1
dhcp-option=tag:vlan60,6,192.168.60.1
host-record=home-assistant.lan,192.168.60.10

# VLAN 99 (Management) intentionally not deployed -- per design doc.
