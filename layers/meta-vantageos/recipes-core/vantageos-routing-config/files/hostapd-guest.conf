# wlan0 = onboard RPi5 radio (brcmfmac, bcm4329-fmac family). Dedicated
# Guest SSID on its own physical radio because neither wifi card on this
# device supports more than one concurrent AP-role VIF (see the note in
# hostapd.conf on why wlan1 uses per-PSK dynamic VLAN instead of a second
# SSID). Routed, not bridged: brcmfmac rejects bridge enslavement outright
# (confirmed on-device -- EOPNOTSUPP), so wlan0 carries the 192.168.20.0/24
# guest subnet directly (see 26-wlan0.network) instead of joining a bridge.
# Downstream firewall (routing-setup.sh, BR20=wlan0), dnsmasq scope, and
# the guest bandwidth cap all key off the interface name and are unchanged.
interface=wlan0
driver=nl80211
ssid=VantageOS-Guest
hw_mode=g
channel=6
country_code=PL
ieee80211n=1
wmm_enabled=1
ieee80211d=1
ieee80211h=1

# WPA2-PSK, password-only, no captive portal.
# Single static passphrase: there's no per-client VLAN assignment to key off of on this
# radio, every station here is Guest by definition.
wpa=2
wpa_key_mgmt=WPA-PSK WPA-PSK-SHA256
wpa_passphrase=uwtjcve1YWVk3Pf7G6QR
wpa_pairwise=CCMP
rsn_pairwise=CCMP
ieee80211w=1
