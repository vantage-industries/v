# wlan0 = onboard RPi5 radio (brcmfmac, bcm4329-fmac family). Dedicated
# Guest SSID on its own physical radio because neither wifi card on this
# device supports more than one concurrent AP-role VIF (see the note in
# hostapd.conf on why wlan1 uses per-PSK dynamic VLAN instead of a second
# SSID). No VLAN tagging here: wlan0 is a plain untagged bridge member of
# br-vlan20 (see 26-wlan0.network / 29-br-vlan20.netdev), so every
# associated client lands directly in the Guest bridge -- same downstream
# firewall, dnsmasq scope, and bandwidth cap as before, unchanged.
# Bridge membership is handled by systemd-networkd (26-wlan0.network's
# Bridge=br-vlan20), not by hostapd's own bridge= option -- avoids hostapd
# and networkd racing to enslave the interface at boot.
interface=wlan0
driver=nl80211
ssid=VantageOS-Guest
hw_mode=g
channel=6
country_code=PL
ieee80211n=1
wmm_enabled=1
ieee80211d=1
ieee80211h=1

# WPA2-PSK, password-only, no captive portal (PDF SS5.3). Single static
# passphrase: there's no per-client VLAN assignment to key off of on this
# radio, every station here is Guest by definition.
wpa=2
wpa_key_mgmt=WPA-PSK WPA-PSK-SHA256
wpa_passphrase=uwtjcve1YWVk3Pf7G6QR
wpa_pairwise=CCMP
rsn_pairwise=CCMP
ieee80211w=1
