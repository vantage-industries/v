# Install as /etc/nginx/snippets/security-hub-api.conf -- included by security-hub.conf.
# The backend half: everything the Go binary answers.
#
# Upstream's own copy of this file comments /swagger/ as "Delete in production image" --
# kept here deliberately (VantageOS call, not an oversight) so Swagger UI stays reachable
# on shipped appliances.

# X-Forwarded-For is SET, not appended.
#
# The API trusts this header only from 127.0.0.1 and takes the rightmost hop, so
# a client-supplied value would be harmless either way -- but there is exactly one
# proxy in this deployment, and overwriting means the header can only ever hold
# an address nginx observed. Using $proxy_add_x_forwarded_for here would forward
# the client's own list with nginx's value appended, which is a longer chain to
# reason about for no gain.
#
# Without these two lines every audit entry on the appliance reads 127.0.0.1 and
# the per-IP login rate limit becomes a single global bucket.
proxy_set_header X-Forwarded-For  $remote_addr;
proxy_set_header X-Real-IP        $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Host              $host;

proxy_http_version 1.1;
proxy_set_header Connection "";

# Matched to server.read_timeout_seconds (15) and write_timeout_seconds (30) in
# config.yaml. nginx must not give up before the API does, or a slow convergence
# surfaces as a 504 with no error the operator can act on -- the classify and
# enrol handlers deliberately wait ~2s on the reconciler.
proxy_connect_timeout 5s;
proxy_send_timeout    15s;
proxy_read_timeout    35s;

location /api/v1/auth/login {
    limit_req zone=securityhub_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://securityhub_api;
}

location /api/v1/auth/recovery {
    limit_req zone=securityhub_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://securityhub_api;
}

location /api/v1/setup/ {
    limit_req zone=securityhub_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://securityhub_api;
}

location /api/ {
    limit_req zone=securityhub_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://securityhub_api;
}

# Unauthenticated liveness probe. It sits outside /api/v1 by design.
location = /healthz {
    access_log off;
    proxy_pass http://securityhub_api;
}

location /swagger/ {
    proxy_pass http://securityhub_api;
}
