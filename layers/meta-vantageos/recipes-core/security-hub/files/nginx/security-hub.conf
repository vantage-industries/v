# Recipe-owned production vhost, adapted from security-hub/backend's own
# deploy/nginx/securityhub.conf: same TLS/rate-limit structure, but the
# frontend root below (securityhub-frontend.conf) points at
# /usr/share/security-hub-ui to match this recipe's do_install layout,
# not upstream's /var/www/securityhub.
upstream securityhub_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=securityhub_login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=securityhub_api:1m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name securityhub.lan vantageos _;

    ssl_certificate     /etc/nginx/ssl/securityhub.crt;
    ssl_certificate_key /etc/nginx/ssl/securityhub.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SecurityHubTLS:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    server_tokens off;

    gzip off;

    access_log /var/log/nginx/securityhub.access.log;
    error_log  /var/log/nginx/securityhub.error.log warn;

    include /etc/nginx/snippets/security-hub-api.conf;
    include /etc/nginx/snippets/security-hub-frontend.conf;
}
