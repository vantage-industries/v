# Install as /etc/nginx/snippets/security-hub-frontend.conf -- included by security-hub.conf.
# root points at this recipe's do_install layout (${datadir}/security-hub-ui), not
# upstream deploy/nginx's /var/www/securityhub.
root /usr/share/security-hub-ui;
index index.html;

location / {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css text/plain image/svg+xml application/manifest+json;

    try_files $uri $uri/ /index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri =404;
}

location = /sw.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location /assets/ {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css text/plain image/svg+xml;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
