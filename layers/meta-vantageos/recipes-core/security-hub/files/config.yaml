# SecurityHub API configuration for the VantageOS appliance.
#
# This is a recipe-owned production config, not security-hub/backend's own dev config.yaml --
# it differs from the upstream default in exactly the ways the appliance needs:
#   - environment: production (blocks cmd/seeddev from ever running)
#   - system.backend: linux (real nft/hostapd/dnsmasq/suricata integration, not mocks)
#   - database.path: absolute (a relative path resolves under this unit's read-only
#     WorkingDirectory and fails)
#   - system.paths.hostapd_psk_file: points at /etc/hostapd/wpa_psk, the path meta-vantageos's
#     own hostapd.conf (recipes-core/vantageos-routing-config/files/hostapd.conf) already
#     declares as wpa_psk_file= -- NOT security-hub's own default of
#     /etc/hostapd/securityhub-wpa-psk, which nothing on this appliance reads.
#   - secrets.device_key is intentionally absent: supplied at runtime as
#     SECURITYHUB_SECRETS_DEVICE_KEY by security-hub-keygen.service, so it's never a build-time
#     or repo-committed value.
#   - cors.allowed_origins cleared: nginx serves the frontend and proxies the API same-origin
#     in production, so no cross-origin requests exist to allow.
#
# Every other value below (system.paths.*, network.*) mirrors what SYSTEM-INTEGRATION.md
# §2.1a/§2.1b recorded as probed from the physical device.

environment: production

server:
  host: 127.0.0.1
  port: 8080
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  shutdown_timeout_seconds: 10
  body_limit: 1M

database:
  path: /var/lib/securityhub/securityhub.db

cors:
  allowed_origins: []

auth:
  session_idle_minutes: 30
  session_absolute_hours: 12
  login_timing_floor_ms: 750
  lockout_threshold: 10
  lockout_minutes: 15
  backoff_after_failures: 3
  password_min_length: 12
  password_max_length: 256
  rate_limit:
    login_per_minute: 10
    login_per_hour: 60

audit:
  retention_days: 365

system:
  backend: linux
  hostapd_interface: wlan1
  nft_family: inet
  nft_table: securityhub
  retire_nft_family: ip
  retire_nft_table: vantageos
  firewall_generation_dir: /var/lib/securityhub/generations
  firewall_confirm_seconds: 60
  reconcile_wait_ms: 2000
  reconcile_interval_seconds: 30
  observe_interval_seconds: 15
  paths:
    dnsmasq_leases: /var/lib/misc/dnsmasq.leases
    dnsmasq_reservations: /etc/dnsmasq.d/securityhub-reservations
    suricata_eve: /var/log/suricata/eve.json
    hostapd_control: /var/run/hostapd
    hostapd_psk_file: /etc/hostapd/wpa_psk

network:
  wan_interface: eth0
  dns_interception: true
  management_interfaces:
    - tailscale0
  management_vlan: 10
  management_ports:
    - 22
    - 443
  ids_queue: 0
