# eve.json is the highest-volume Suricata output (every alert/http/dns/tls/
# file/ssh event lands here) -- rotate it more aggressively and keep fewer
# generations than the other suricata logs.
/var/log/suricata/eve.json {
    daily
    size 20M
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    postrotate
        systemctl reload suricata.service >/dev/null 2>&1 || true
    endscript
}

/var/log/suricata/*.log {
    daily
    size 10M
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    postrotate
        systemctl reload suricata.service >/dev/null 2>&1 || true
    endscript
}
